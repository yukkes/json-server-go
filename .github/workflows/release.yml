name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: json-server-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: json-server-linux-arm64
          - goos: windows
            goarch: amd64
            asset_name: json-server-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset_name: json-server-windows-arm64.exe
          - goos: darwin
            goarch: amd64
            asset_name: json-server-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset_name: json-server-darwin-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        # Use setup-go's built-in cache to restore modules and build cache
        cache: true
        cache-dependency-path: go.sum

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        go build -v -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o ${{ matrix.asset_name }} main.go

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ matrix.asset_name }}
